<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchs du jour</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

<header class="bg-gradient-to-r from-purple-600 via-purple-500 to-purple-600 text-white p-4 text-center text-2xl font-bold shadow">
  Matchs du jour ⚽
</header>

<main class="p-4">
  <div id="matches" class="grid gap-4 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3"></div>
</main>

<script>
async function loadMatches() {
  const res = await fetch('/api/matches');
  const matches = await res.json();
  const container = document.getElementById('matches');
  console.log("Matches reçus :", matches);

  if(matches.length === 0) {
    container.innerHTML = `<p class="text-center col-span-full text-gray-500 font-semibold text-lg mt-10">Aucun match prévu aujourd'hui.</p>`;
    return;
  }

  container.innerHTML = matches.map(match => {
    const homeScore = match.score.fulltime.home ?? "-";
    const awayScore = match.score.fulltime.away ?? "-";
    const matchTime = new Date(match.fixture.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

    return `
    <div class="bg-white rounded-xl shadow-md hover:shadow-xl transition p-4 flex flex-col justify-between">
      <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-3">
          <img src="${match.teams.home.logo}" alt="${match.teams.home.name}" class="w-12 h-12">
          <span class="font-semibold text-lg">${match.teams.home.name}</span>
        </div>

        <span class="font-bold text-xl">${homeScore} - ${awayScore}</span>

        <div class="flex items-center gap-3">
          <span class="font-semibold text-lg">${match.teams.away.name}</span>
          <img src="${match.teams.away.logo}" alt="${match.teams.away.name}" class="w-12 h-12">
        </div>
      </div>

      <div class="flex justify-between text-sm text-gray-500">
        <span>${match.league.name} (ID: ${match.league.id})</span>
        <span>${matchTime}</span>
      </div>
    </div>`;
  }).join('');
}

loadMatches();
setInterval(loadMatches, 300000);
</script>

</body>
</html>
