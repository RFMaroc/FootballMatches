<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchs du jour</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

<header class="bg-blue-900 text-white p-4 text-center text-xl font-bold">
  Matchs du jour
</header>

<main class="p-4">
  <div id="matches" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
</main>

<script>
async function loadMatches() {
  const res = await fetch('/api/matches');
  const matches = await res.json();
  const container = document.getElementById('matches');

  if(matches.length === 0) {
    container.innerHTML = `<p class="text-center col-span-full">Aucun match aujourd'hui.</p>`;
    return;
  }

  container.innerHTML = matches.map(match => {
    const homeScore = match.score.fulltime.home ?? "-";
    const awayScore = match.score.fulltime.away ?? "-";
    const matchTime = new Date(match.fixture.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

    return `
    <div class="bg-white p-4 rounded-lg shadow hover:shadow-lg transition duration-300">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center gap-2">
          <img src="${match.teams.home.logo}" alt="${match.teams.home.name}" class="w-10 h-10">
          <span class="font-semibold">${match.teams.home.name}</span>
        </div>

        <span class="font-bold text-lg">${homeScore} - ${awayScore}</span>

        <div class="flex items-center gap-2">
          <span class="font-semibold">${match.teams.away.name}</span>
          <img src="${match.teams.away.logo}" alt="${match.teams.away.name}" class="w-10 h-10">
        </div>
      </div>

      <div class="text-sm text-gray-500 flex justify-between">
        <span>${match.league.name} (ID: ${match.league.id})</span>
        <span>${matchTime}</span>
      </div>
    </div>`;
  }).join('');
}

// Chargement initial + rafraîchissement toutes les 5 minutes
loadMatches();
setInterval(loadMatches, 300000);
</script>

</body>
</html>
